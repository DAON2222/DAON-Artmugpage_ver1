<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시그니처 - Index 5</title>
<style>
    /* 1. 사용할 폰트들 모두 불러오기 (Dongle 및 Noto Sans KR) */
    @import url('https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&family=Noto+Sans+KR:wght@400;700;900&family=Plus+Jakarta+Sans:wght@500;700&display=swap');

    :root { 
        --point: #85CCA1;       /* 포인트 색상 */
        --bg: #FFFFFF;          /* 화이트 계열 배경색 */
        --card: #F8F9FA;        /* 카드 배경색 */
        --border: #E2E8F0;      /* 테두리 선 */
        --text: #4A6B53;        /* 가독성을 갖춘 진한 그린 텍스트 */
    }

    .daon-root * { box-sizing: border-box; margin: 0; padding: 0; }
    .daon-root {
        /* 기본 폰트는 Dongle로 설정 */
        font-family: 'Dongle', sans-serif;
        background-color: var(--bg);
        
        /* 💡 4번 디자인: 격자선을 지우고, 오리지널 연두색이 부드럽게 감도는 오로라 그라데이션 적용 */
        background-image: 
            radial-gradient(circle at 10% 15%, rgba(133, 204, 161, 0.15) 0%, transparent 40%),
            radial-gradient(circle at 90% 85%, rgba(133, 204, 161, 0.12) 0%, transparent 45%);
        background-attachment: fixed; /* 스크롤 시에도 배경 빛이 은은하게 고정되도록 설정 */
        
        color: var(--text);
        max-width: 1200px;
        margin: 0 auto;
        padding: 60px 0;
        
        font-size: 24px; 
        line-height: 1.2;
    }

    /* 🏛 라벨 박스 영역 */
    .daon-section-lbl-wrap {
        display: flex;
        justify-content: center;
        margin-bottom: 20px; 
    }
    .daon-section-lbl {
        display: inline-block;
        padding: 8px 24px;
        background: #FFFFFF;
        border: 1px solid var(--border);
        border-radius: 4px; 
        
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 11px; 
        color: var(--text); 
        letter-spacing: 0.35em;
        font-weight: 700;
        text-align: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.01);
        line-height: 1.5;
    }

    /* 시그니처 패키지 카드 */
    .daon-pkg-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 35px; overflow: hidden; margin: 0 40px; box-shadow: 0 10px 30px rgba(178, 213, 184, 0.05); }
    
    /* 헤더 전체 위아래 패딩 및 요소 간격 */
    .daon-pkg-top { 
        padding: 30px 40px; 
        border-bottom: 1.5px solid var(--border); 
        display: flex; 
        flex-direction: column;
        align-items: center; 
        text-align: center;
        gap: 8px;
    }
    
    /* Signature가 완전히 가운데 정렬되도록 잡아주는 3단 분할 레이아웃 */
    .daon-pkg-main-row {
        display: flex;
        align-items: baseline;
        justify-content: center;
        width: 100%;
    }

    /* 왼쪽 여백용 가상 요소 */
    .daon-pkg-main-row::before {
        content: '';
        flex: 1;
        display: block;
    }

    /* Signature 타이틀을 완전한 정중앙에 위치하도록 설정 */
    .daon-pkg-title-area {
        flex: 0 0 auto;
        text-align: center;
    }

    /* 원래의 단색 및 텍스트 섀도우 스타일 유지 */
    .daon-pkg-title-area h3 { 
        font-size: 80px; 
        font-weight: 700; 
        color: var(--point); 
        letter-spacing: -1px; 
        text-shadow: 0px 1px 0px rgba(0,0,0,0.05); 
        line-height: 1; 
    }
    
    /* 가격을 Signature의 중앙 정렬을 해치지 않으면서 오른쪽 구역으로 이동 */
    .daon-pkg-price { 
        flex: 1;
        text-align: left;
        padding-left: 40px; 
        
        font-family: 'Dongle', sans-serif; 
        font-size: 42px; 
        font-weight: 700; 
        color: var(--text); 
        line-height: 1; 
        white-space: nowrap;
    }
    .daon-krw { font-size: 0.65em; margin-left: 6px; color: var(--text); font-weight: 400; }
    
    /* 둥근 사각형 배지 행의 밀착 정렬 */
    .daon-pkg-summary-row { 
        display: flex; 
        flex-wrap: wrap; 
        justify-content: center;
        gap: 8px;
        margin: 0;
    }
    
    /* 둥근 사각형 배지 스타일 */
    .daon-summary-pill { 
        padding: 5px 16px; 
        background: #F1F5F9; 
        border: 1.5px solid #E2E8F0; 
        border-radius: 50px; 
        color: #718096; 
        
        font-family: 'Noto Sans KR', sans-serif; 
        font-size: 12px; 
        font-weight: 700; 
        line-height: 1.5; 
    }
    .daon-summary-pill.highlight { background: var(--point); color: #FFFFFF; border-color: var(--point); }

    .daon-video-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 40px; }
    .daon-video-grid iframe { width: 100%; aspect-ratio: 16/9; border: none; border-radius: 15px; background: #000; }

    /* 모바일 대응 */
    @media (max-width: 768px) {
        .daon-video-grid { grid-template-columns: 1fr; }
        .daon-pkg-top { padding: 25px 20px; gap: 8px; }
        
        .daon-pkg-main-row { flex-direction: column; align-items: center; gap: 5px; }
        .daon-pkg-main-row::before { display: none; }
        .daon-pkg-price { padding-left: 0; text-align: center; font-size: 38px; }
        .daon-pkg-title-area h3 { font-size: 54px; }
    }
</style>
</head>
<body>
<div class="daon-root">
    
    <div class="daon-section-lbl-wrap">
        <div class="daon-section-lbl">PORTFOLIO · SIGNATURE</div>
    </div>

     <div class="daon-pkg-card">
        <div class="daon-pkg-top">
            
            <div class="daon-pkg-main-row">
                <div class="daon-pkg-title-area">
                    <h3>Signature</h3>
                </div>
                <div class="daon-pkg-price">390,000~<span class="daon-krw">KRW</span></div>
            </div>

            <div class="daon-pkg-summary-row">
                <span class="daon-summary-pill highlight">30~35 Days</span>
                <span class="daon-summary-pill">무료컨펌 1회</span>
                <span class="daon-summary-pill">고급 연출/카메라/보정</span>
                <span class="daon-summary-pill">자막 애니메이팅</span>
            </div>

        </div>
        
        <div class="daon-video-grid">
            <iframe src="https://www.youtube.com/embed/embed/AUJ_hjjDKEk?si=mjAsTUOgfWgjXD4C"></iframe>
            <iframe src="https://www.youtube.com/embed/GR0jig25hbc?si=ceepJBdw5oH8n5WT"></iframe>
            <iframe src="https://www.youtube.com/embed/GR0jig25hbc?si=ceepJBdw5oH8n5WT"></iframe>
        </div>
    </div>
</div>
</body>
</html>
